<style>
:root{--ana:#D7262E;--anaP:#FF5A5F;--krem:#F4F1EA;--koyu:#16181D;--koyu2:#0E0F12;--vurgu:#F2C14E;--yesil:#3BB273;--kart:rgba(18,20,26,.9)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;color:var(--krem);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.kart{background:var(--kart);border:1.5px solid var(--ana);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ust{position:fixed;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5;max-width:620px}
.ust>*{pointer-events:auto}
.baslik{display:flex;gap:10px;align-items:center;padding:10px 12px}
.logo{width:44px;height:44px;border-radius:50%;flex:none;background:var(--ana);display:grid;place-items:center;font-weight:900;font-size:15px;overflow:hidden;border:2px solid var(--krem)}
.logo img{width:100%;height:100%;object-fit:cover}
.sayac{flex:1;min-width:0}
.sayac .s1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.sayac b{font-size:24px;color:var(--anaP);font-variant-numeric:tabular-nums;line-height:1}

.ilerleme{height:7px;background:#2a2d36;border-radius:5px;margin:6px 0 4px;overflow:hidden;position:relative}

.sonraki{font-size:11.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.etiket{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#2a2d36;color:#b8c0d8;letter-spacing:.3px}

.btn{height:42px;padding:0 14px;border-radius:9px;background:var(--ana);font-weight:800;font-size:14px;white-space:nowrap}

.oneri{position:absolute;left:7px;right:7px;top:52px;background:#1c1f27;border-radius:10px;overflow:hidden;display:none;border:1px solid #333846;z-index:3}
.oneri div{padding:10px 12px;font-size:14px;border-bottom:1px solid #2a2d36;cursor:pointer}
.oneri div:hover,.oneri div.sec{background:#2a2d36}
.oneri div span{opacity:.55;font-size:12px;float:right}
.bilgi{padding:11px 12px;display:none}
.bilgi .ad{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rozet{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:20px;background:#2a2d36}

.izgara{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0}
.izgara div{background:#22252e;border-radius:9px;padding:7px 4px;text-align:center}
.izgara small{display:block;font-size:10px;letter-spacing:.8px;opacity:.6;font-weight:700}
.izgara b{font-size:14px}
.satir{display:flex;gap:6px;flex-wrap:wrap}
.alt{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none}
.alt>*{pointer-events:auto}
.modlar{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.modlar::-webkit-scrollbar{display:none}
.modlar button{flex:none;height:36px;padding:0 13px;border-radius:10px;background:rgba(18,20,26,.92);border:1.5px solid #333846;font-weight:700;font-size:13px}
.modlar button.acik{background:var(--ana);border-color:var(--ana)}
.serit{background:var(--ana);height:30px;display:flex;align-items:center;overflow:hidden;font-size:13px;font-weight:700}
.serit .e{flex:none;background:var(--koyu2);height:100%;display:flex;align-items:center;padding:0 10px;font-size:11px;letter-spacing:1px;font-weight:900;z-index:1}
.serit .k{white-space:nowrap;animation:kay 40s linear infinite;padding-left:100%}
@keyframes kay{to{transform:translateX(-100%)}}
.etiketler{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.et{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:11px;font-weight:700;background:rgba(14,15,18,.82);padding:2px 6px;border-radius:5px;white-space:nowrap;border:1px solid rgba(255,255,255,.15);will-change:transform}
.et.ben{background:var(--ana);border-color:var(--krem);font-size:13px;z-index:2}
.panel{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 20px));max-height:calc(100% - 40px);overflow:auto;padding:16px;display:none}
.panel h2{margin:0 0 10px;font-size:20px}

.karar{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#22252e;border-radius:10px;margin:6px 0}
.karar .ik{font-size:20px;width:28px;text-align:center}
.karar .m{flex:1;font-size:13px;opacity:.75}
.karar .m b{display:block;font-size:15px;opacity:1;color:var(--krem)}
.karar.siradaki{border:1.5px dashed var(--vurgu)}

table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 4px;border-bottom:1px solid #2a2d36;text-align:left}
th{font-size:11px;opacity:.6}
td input{width:18px;height:18px}
.kod{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0b0d12;border-radius:8px;padding:8px;word-break:break-all;user-select:text;-webkit-user-select:text}

.giris .logo{width:110px;height:110px;margin:0 auto 14px;font-size:34px;border-width:3px;box-shadow:0 0 40px var(--ana)}

.giris p{margin:6px 0 18px;opacity:.85;font-size:14.5px}

.giris .btn{width:100%;height:50px;margin-top:10px;font-size:16px;border-radius:12px}
.giris .link{background:none;text-decoration:underline;opacity:.8;margin-top:16px;font-size:13.5px}
.giris .uyari{font-size:13.5px;background:#2a1416;border:1px solid var(--ana);border-radius:10px;padding:10px;margin-top:12px;display:none;line-height:1.45}
.yuk{position:fixed;inset:0;z-index:30;background:#0b0d12;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:700}
.yuk .bar{width:220px;height:8px;background:#22252e;border-radius:6px;overflow:hidden}
.yuk .bar i{display:block;height:100%;width:5%;background:var(--ana);transition:width .2s}
.iguyari{position:fixed;left:10px;right:10px;bottom:84px;z-index:9;padding:10px 12px;font-size:13px;display:none}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:25;background:var(--koyu);border:1.5px solid var(--vurgu);padding:12px 18px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
.yon{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:4}
.yon button{width:42px;height:42px;border-radius:10px;background:rgba(18,20,26,.85);border:1.5px solid #333846;font-size:17px}
@media (min-width:900px){.ust{max-width:480px}.panel{width:600px}}
.renkBant{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:94vw;z-index:6;display:none;text-align:center;pointer-events:none}
.renkBant .kutu{display:inline-block;padding:10px 22px 12px;border-radius:16px;background:rgba(10,11,15,.82);backdrop-filter:blur(6px);border:2px solid var(--ana)}
.renkBant b{display:block;font-size:clamp(20px,4.4vw,34px);font-weight:900;letter-spacing:.5px}
.renkBant small{font-size:13px;opacity:.85;font-weight:700}
.renkBant .sw{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-4px;margin-right:4px;border:2px solid #fff}
@media (min-width:900px){.renkBant{left:auto;right:16px;top:16px;bottom:auto;transform:none}}
.aday{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:#1c1f27;border-radius:12px;margin:6px 0}
.aday .sw{width:44px;height:44px;border-radius:50%;border:2px solid #fff3}
.aday .m{font-size:13px;min-width:0}.aday .m b{display:block;font-size:14.5px}
.aday .cubuk{height:6px;border-radius:4px;background:#2a2d36;margin-top:5px;overflow:hidden}.aday .cubuk i{display:block;height:100%;background:var(--vurgu)}
.aday.lider{outline:2px solid var(--vurgu)}
body.reel .ust,body.reel .alt,body.reel .yon,body.reel .renkBant,body.reel #etiketler,body.reel .iguyari,body.reel .toast{display:none!important}
.reelYazi{position:fixed;left:0;right:0;top:19%;z-index:8;text-align:center;pointer-events:none;padding:0 7%}
.reelYazi b{display:inline-block;font-size:clamp(30px,9vw,64px);font-weight:900;line-height:1.05;color:#fff;letter-spacing:.5px;
  text-shadow:0 3px 0 #000,0 0 22px rgba(0,0,0,.75);-webkit-text-stroke:1.5px #000;animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
.reelYazi b.vurgu{color:var(--vurgu)}
.reelYazi small{display:block;margin-top:10px;font-size:clamp(17px,4.6vw,30px);font-weight:900;color:#fff;text-shadow:0 2px 0 #000,0 0 14px #000}
.reelYazi .sw{display:inline-block;width:.8em;height:.8em;border-radius:50%;border:3px solid #fff;vertical-align:-.05em;margin-right:.25em}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.reelCip{position:fixed;left:50%;top:64%;transform:translateX(-50%);z-index:8;padding:8px 18px;border-radius:30px;background:rgba(10,11,15,.78);color:#fff;font-weight:900;font-size:clamp(16px,4.4vw,26px);pointer-events:none;white-space:nowrap}
.reelCip .sw{display:inline-block;width:1em;height:1em;border-radius:50%;border:2px solid #fff;vertical-align:-.15em;margin-right:.4em}
.reelIz{position:fixed;left:0;right:0;top:11%;z-index:8;text-align:center;font-weight:900;font-size:clamp(12px,3.2vw,18px);color:#fff;opacity:.85;text-shadow:0 1px 6px #000;pointer-events:none}
.reelBasla{position:fixed;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:800;font-size:18px;padding:30px;cursor:pointer}
</style>
</head>

<script>

(function(){var ig=/Instagram|FBAN|FBAV|TikTok|musical_ly|Bytedance/i.test(navigator.userAgent);
 function hata(){if(window.__hazir)return;var y=document.getElementById('yukYazi');if(y)y.innerHTML='<b>Stat bu tarayıcıda açılamadı.</b><br><span style="font-weight:400;font-size:13px;opacity:.85">'+(ig?'Sağ üstteki ••• menüsünden “Tarayıcıda aç”ı seç.':'Tarayıcını güncelle ya da Chrome / Safari ile aç.')+'</span>';}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ======================================================================
   AYAR — markanı, renklerini ve hesabını buradan değiştir.
   ====================================================================== */
const AYAR = {
  marka: '100 Bin Koltuk',          // giriş ekranı başlığı
  kisaltma: '100K',                  // logo yoksa yuvarlakta yazan
  logo: 'logo.png',                 // yoksa kısaltma gösterilir
  hesap: '100binkoltuk',                // @ olmadan Instagram hesabın
  siteLink: location.origin + location.pathname,
  renk: { ana:'#D7262E', ikinci:'#F4F1EA', koyu:'#16181D', vurgu:'#F2C14E' }, // renk oylaması bitince kararlar.json → renk bunu ezer
  kapasite: 100000,                 // toplam koltuk (loca dahil)
  locaHakki: 1000,                  // ilk N taraftar locada oturur (kararlar.json → locaHakki ile değişir; en fazla ~1.600)
  renksiz: { ana:'#8d939e', ikinci:'#eceef2' },   // renk seçilene kadar stat bu "boyanmamış" halde durur
  formaRenkleri: ['#D7262E','#D7262E','#D7262E','#B81E26','#F4F1EA','#1b1d22'],
  tribunAdlari: { B:'5. Tribün', K:'Kuzey Ana Tribün', G:'Güney Tribünü', D:'Doğu Kale Arkası',
                  GB:'Güneybatı Köşe', GD:'Güneydoğu Köşe', KBK:'Kuzeybatı Köşe', KDK:'Kuzeydoğu Köşe' },
  // Katların açılış sırası. Otomatik modda taraftar sayısı arttıkça bu sırayla açılır;
  // sıradaki kat "inşaat" olarak görünür.
  acilisPlani: ['LOCA','LOCA2','B1','G1','K1','D1','GB1','GD1','KBK1','KDK1','B2','G2','K2','D2','GB2','GD2','KBK2','KDK2'],
  reklam: ['BURASI KİRALIK','Markan burada · DM at'],
  listeGuncellemeNotu: 'Liste günde birkaç kez güncellenir.',
};

/* ================== URL / VERİ ================== */
const url = new URLSearchParams(location.search);
const KAYIT = url.has('kayit');
if(KAYIT){ window.__SANAL = 0; performance.now = () => window.__SANAL; }
const YONETIM = url.get('yonetim') === '1';
const $ = id => document.getElementById(id);
const bekle = () => new Promise(r => setTimeout(r, 0));
async function yukle(o, y){ $('yukBar').style.width = Math.round(o*100)+'%'; if(y) $('yukYazi').textContent = y; await bekle(); }
async function jsonAl(ad){ try{ const r = await fetch(ad+'?t='+Date.now(), {cache:'no-store'}); if(r.ok) return await r.json(); }catch(e){} return null; }

await yukle(.05, 'Taraftar listesi okunuyor…');
const [vTak, vKar, vStad] = await Promise.all([jsonAl('takipciler.json'), jsonAl('kararlar.json'), jsonAl('stad.json')]);
const KARAR = Object.assign({ stadAdi:null, takimAdi:null, arma:null, ilk11:[], siradaki:null, hedef:null, gecmis:[] },
  vKar ? (vKar.instagram || vKar) : {});

/* ================== RENK OYLAMASI ==================
   kararlar.json → "renk": {"ad":"Sarı-Kırmızı","ana":"#…","ikinci":"#…"}  (seçildiyse)
                 → "renkOylamasi": [{"ad":"Sarı-Kırmızı","takim":"…","ana":"#…","ikinci":"#…","oy":812}, …]
   Renk seçilene kadar stat "boyanmamış" (gri) durur; taraftarlar oy verdikleri renklerin formalarını giyer.
   ?renk=Sarı-Kırmızı  ya da  ?renk=A90432-FDB912  → o renklerle önizleme (reel çekimi için) */
const MARKA_RENK = { ...AYAR.renk };
const hexTemiz = h => (h && /^#?[0-9a-f]{6}$/i.test(String(h).trim())) ? '#' + String(h).trim().replace('#','') : null;

const NRM = V.map((v,i) => { const w = V[(i+1)%8]; let n = [w[1]-v[1], -(w[0]-v[0])]; const l = Math.hypot(n[0],n[1]); n = [n[0]/l, n[1]/l];
  if(n[0]*(v[0]+w[0]) + n[1]*(v[1]+w[1]) < 0) n = [-n[0], -n[1]]; return n; });

const katla = s => trK(s).replace(/[çğıöşü]/g, c => ({ç:'c',ğ:'g',ı:'i',ö:'o',ş:'s',ü:'u'}[c]));
const VARSAYILAN_ANAHTAR = {
  'Sarı-Kırmızı':  ['galatasaray','galatasarat','galatasara','qalatasaray','galatasray','gs','cimbom','cim bom','ultraslan','aslan','goztepe','kayserispor','kayseri','sari kirmizi','sarikirmizi'],
  'Sarı-Lacivert': ['fenerbahce','fener','fb','kanarya','ankaragucu','sari lacivert','sarilacivert'],
  'Siyah-Beyaz':   ['besiktas','besktas','bjk','kartal','carsi','altay','siyah beyaz','siyahbeyaz'],
  'Kırmızı-Beyaz': ['antalyaspor','antalya','samsunspor','samsun','sivasspor','sivas','kirmizi beyaz','kirmizibeyaz'],
  'Bordo-Mavi':    ['trabzonspor','trabzon','ts','firtina','bordo mavi','bordomavi'],

function sayimYap(metin, hepsi = false){   // hepsi: her yorum ayrı oy (tekrarlar dahil)
  const ad = ADAYLAR.map(d => ({ d, rx: [...new Set([...(VARSAYILAN_ANAHTAR[d.ad] || []), ...(d.anahtar || []), katla(d.ad).replace('-', ' '), d.takim ? katla(d.takim) : null].filter(Boolean))]
    .map(a => { const g = a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '[\\s-]*');   // uzun adlar bitişik yazımda da (BeşiktaşBeşiktaş), kısalar (gs, fb) tek kelime olarak
      return new RegExp(a.length < 6 ? '(^|[^a-z0-9])' + g + '([^a-z0-9]|$)' : g); }) }));
  const sayim = new Map(ADAYLAR.map(d => [d.ad, 0])), oyVeren = new Set(), eslesmeyen = []; let yorum = 0, tekrar = 0;
  for(const ham of String(metin).split(/\r?\n/)){ const satir = ham.trim(); if(!satir) continue;
    const m = satir.match(/^@?([A-Za-z0-9._]{2,30})\s*[:\t,;]\s*(.+)$/); const kim = m ? m[1].toLowerCase() : null, yaz = katla(m ? m[2] : satir);
    const bul = ad.find(a => a.rx.some(r => r.test(yaz))); yorum++;
    if(!bul){ if(eslesmeyen.length < 12) eslesmeyen.push(satir.slice(0, 60)); continue; }
    if(kim){ if(oyVeren.has(kim) && !hepsi){ tekrar++; continue; } oyVeren.add(kim); }
    sayim.set(bul.d.ad, sayim.get(bul.d.ad) + 1); }

}
